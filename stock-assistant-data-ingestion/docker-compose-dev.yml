# Standalone dev-environment compose file — currently used to run the
# 7-14 day volume test (see docs/volume-test-plan.md). Full copy of the base
# docker-compose.yml services plus what an unattended multi-day run needs:
# restart-on-crash and pg_stat_statements for Q-9 data collection. Kept as
# one complete file (not a base+override merge) so the whole picture is
# readable in one place — costs some duplication with docker-compose.yml if
# the base service config changes, acceptable for now.
#
# Start with: docker compose -f docker-compose-dev.yml up -d

services:
  sadi:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sadi
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # shared_preload_libraries requires this at server start; the extension
    # itself is created once via the mounted init script below. Feeds the
    # Q-9 analysis in docs/volume-test-plan.md — no app code changes needed,
    # this is Postgres-side observability only.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c pg_stat_statements.max=1000
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sadi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/volume-test/init-pg-stat-statements.sql:/docker-entrypoint-initdb.d/01-pg-stat-statements.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
